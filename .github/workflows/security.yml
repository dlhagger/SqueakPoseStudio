name: Supply Chain

on:
  push:
    branches: ["main"]
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    - cron: "13 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit locked dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          version: "0.12.2"

      - name: Verify the lockfile is current
        run: uv lock --check

      - name: Audit production dependencies
        run: >-
          uv audit --locked --no-default-groups
          --python-version 3.12
          --python-platform x86_64-unknown-linux-gnu

      - name: Generate CycloneDX SBOM
        run: >-
          uv export --locked --no-default-groups
          --preview-features sbom-export
          --format cyclonedx1.5
          --output-file "${RUNNER_TEMP}/squeakpose-sbom.cdx.json"

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: squeakpose-sbom-${{ github.sha }}
          path: ${{ runner.temp }}/squeakpose-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
