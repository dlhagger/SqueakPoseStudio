name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          version: "0.11.19"

      - name: Install Python
        run: uv python install

      - name: Install locked test dependencies
        run: uv sync --locked --only-group test

      - name: Run unit tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked --only-group test python -m unittest discover -s tests -q
