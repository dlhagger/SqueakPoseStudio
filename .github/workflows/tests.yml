name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          prune-cache: true
          version: "0.12.2"

      - name: Install Python
        run: uv python install

      - name: Install locked development tools
        run: uv sync --locked --only-group dev

      - name: Lint Python sources
        run: uv run --locked --only-group dev ruff check .

      - name: Type-check domain and service boundaries
        run: uv run --locked --only-group dev mypy

      - name: Check Python formatting
        run: uv run --locked --only-group dev ruff format --check .

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          prune-cache: true
          version: "0.12.2"

      - name: Install Python
        run: uv python install

      - name: Install locked test dependencies
        run: uv sync --locked --only-group test

      - name: Run unit tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked --only-group test python -m unittest discover -s tests -q

      - name: Construct and render the application UI
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked --only-group test python tests/render_ui_screenshots.py --output-dir "${{ runner.temp }}/squeakpose-ui"

  windows-unit-tests:
    # Windows has its own code paths (cancel marker files, process liveness checks,
    # credential file locking, file replacement while open) that Linux CI cannot exercise.
    name: Unit tests (Windows)
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          prune-cache: true
          version: "0.12.2"

      - name: Install Python
        run: uv python install

      - name: Install locked test dependencies
        run: uv sync --locked --only-group test

      - name: Run unit tests
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          QT_QPA_PLATFORM: offscreen
          # The offscreen platform does not use Windows' font system and PyQt6 no
          # longer bundles fonts; use the app's bundled Fira Sans.
          QT_QPA_FONTDIR: ${{ github.workspace }}\fonts
        run: uv run --locked --only-group test python -m unittest discover -s tests -q

      - name: Construct and render the application UI
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          QT_QPA_PLATFORM: offscreen
          # The offscreen platform does not use Windows' font system and PyQt6 no
          # longer bundles fonts; use the app's bundled Fira Sans.
          QT_QPA_FONTDIR: ${{ github.workspace }}\fonts
        run: uv run --locked --only-group test python tests/render_ui_screenshots.py --output-dir "${{ runner.temp }}/squeakpose-ui"
